appId: com.123cloud.desktop
productName: 123Cloud
copyright: 123Cloud
afterSign: build/afterSign.cjs

# 自动更新元数据：打包时把 app-update.yml 写进应用资源，并生成 latest*.yml
# 随安装包一起上传 Release，electron-updater 据此检测新版本。
publish:
  provider: github
  owner: weige146
  repo: 123Cloud

directories:
  output: release
  buildResources: build

files:
  - electron/**/*
  - package.json

extraResources:
  - from: backend-dist/cloudgateway
    to: cloudgateway
    filter:
      - "**/*"

mac:
  icon: build/icon.icns
  category: public.app-category.utilities
  identity: null
  artifactName: ${productName}-${version}-macOS-arm64.${ext}
  target:
    - target: dmg
  darkModeSupport: true

dmg:
  title: 123Cloud
  window:
    width: 540
    height: 380

win:
  icon: build/icon.ico
  artifactName: ${productName}-${version}-Windows-x64.${ext}
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 123Cloud
