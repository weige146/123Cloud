<!doctype html>
<html lang="zh-CN" data-theme="dark" data-theme-preference="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11131f" />
    <script>
      (() => {
        try {
          const raw = JSON.parse(localStorage.getItem("admin-ui-preferences-v3") || "{}");
          const legacyUi = JSON.parse(localStorage.getItem("admin-ui-preferences-v2") || "{}");
          const legacy = localStorage.getItem("admin-theme-preference");
          const normalize = (value) => ["auto", "light", "dark"].includes(value)
            ? value
            : (["purple", "transparent", "glass"].includes(value) ? "auto" : "");
          const preference = normalize(raw.theme)
            || normalize(legacyUi.theme)
            || normalize(legacy)
            || "auto";
          const resolved = preference === "auto"
            ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : preference;
          const dark = resolved === "dark";
          const root = document.documentElement;
          root.dataset.theme = resolved;
          root.dataset.themePreference = preference;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]')?.setAttribute(
            "content",
            ({ light: "#f3f4f5", dark: "#111315" })[resolved]
          );
        } catch {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
